[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "meandir"
version = "0.1.0"
description = "Python port of MEANDIR (Mixing Elements ANd Dissolved Isotopes in Rivers), a Monte Carlo inversion model for dissolved river chemistry"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
    "pandas>=1.5",
    "openpyxl>=3.0",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["meandir*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
